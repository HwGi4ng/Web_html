<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hahaha</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<h1 class="rainbow">Thương hiệu thời trang</h1>
<main class="intro">
  <img src="images/cua-hang.jpg" alt="Giá treo áo len và áo khoác tông màu be, nâu">
  <p>Chào mừng bạn đến với <strong>Hahaha</strong> – nơi thời trang không cần quá nghiêm túc!
  Chúng mình mang đến những chiếc áo len ấm áp, áo khoác dáng rộng và phụ kiện xinh xắn,
  giúp bạn mặc đẹp mỗi ngày mà vẫn luôn thoải mái và vui vẻ.</p>
  <p class="photo-credit">Ảnh: Unsplash</p>
</main>

<script>
  // Tách tiêu đề thành từng chữ cái, mỗi chữ bọc trong 1 thẻ <span>
  const title = document.querySelector(".rainbow");
  const letters = [...title.textContent];
  title.innerHTML = "";
  letters.forEach((letter, i) => {
    const span = document.createElement("span");
    span.textContent = letter;
    span.style.setProperty("--i", i); // số thứ tự chữ, dùng để lệch màu
    title.appendChild(span);
  });
</script>

</body>
</html>
